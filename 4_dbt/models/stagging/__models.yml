version: 2

models:
  - name: benchmark_score
    description: "Modelo generado a partir de Nuevo_benchmark_scores.csv"
    columns:
      - name: "model_id"
        description: "Descripción para model_id"
        tests:
          - not_null
          - unique
      - name: "benchmark_id"
        description: "Descripción para benchmark_id"
        tests:
          - not_null
          - unique
      - name: "score"
        description: "Descripción para score"
      - name: "evaluation_date"
        description: "Descripción para evaluation_date"
      - name: "notes"
        description: "Descripción para notes"

  - name: benchmark
    description: "Modelo generado a partir de Nuevo_benchmarks.csv"
    columns:
      - name: "benchmark_id"
        description: "Descripción para benchmark_id"
        tests:
          - not_null
          - unique
      - name: "benchmark_name"
        description: "Descripción para benchmark_name"
        tests:
          - not_null
      - name: "full_name"
        description: "Descripción para full_name"
        tests:
          - not_null
      - name: "category"
        description: "Descripción para category"
      - name: "metric"
        description: "Descripción para metric"
      - name: "num_tasks"
        description: "Descripción para num_tasks"
      - name: "description"
        description: "Descripción para description"
      - name: "saturated"
        description: "Descripción para saturated"


  