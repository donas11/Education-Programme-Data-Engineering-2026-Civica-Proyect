version: 2

models:
  - name: stg_openrouter_models
    description: "Modelos LLM procedentes de Openroute"
    columns:
      - name: model_id
        description: "Proveedor/Nombre del modelo-Fecha"
        tests:
          - not_null
          - unique

      - name: model_name
        description: "Proveedor/Nombre del modelo"

      - name: input_price_per_token
        description: "Precio por token procesado de entrada "

      - name: output_price_per_token
        description: "Precio por token procesado de salida"

      - name: total_context
        description: "Capacidad máxima total de tokens"

      - name: max_output_tokens
        description: "Número máximo de tokens que el modelo puede generar como respuesta"

      - name: cache_read
        description: "Precio de lectura de token desde una caché de respuestas previamente generadas "

      - name: cache_write
        description: "Escritura de lectura de token desde una caché de respuestas previamente generadas "

      - name: input_audio
        description: "Precio por cada token de audio de entrada procesado"

      - name: input_audio_cache
        description: "Precio por Lectura desde caché de un audio ya procesado"  

  - name: stg_nuevo_openrouter_models
    description: "Modelos LLM procedentes de Openroute enriquecidos"
    columns:
      - name: id
        description: "Proveedor/Nombre del modelo-Fecha"
        tests:
          - not_null
          - unique

      - name: tipo
        description: "los tipos de plan del modelo, puede ser Free, Standart,reasoning,cached"

      - name: es_free
        description: "si el plan del modelo es gratuito"

      - name: es_reasoning
        description: "si el plan del modelo es de razonamiento"

      - name: es_cached
        description: "si el plan del modelo tiene caché de contexto"

      - name: es_batch
        description: "si el plan del modelo es de batch"

      - name: input_$/1M
        description: "Precio por Millon de tokens procesado de entrada"

      - name: output_$/1M
        description: "Precio por Millon de tokens procesado de salida"

      - name: reasoning_$/1M
        description: "Precio por Millon de tokens procesado de razonamiento de entrada "

      - name: cache_read_$/1M
        description: "Precio de lectura de token desde una caché de respuestas previamente generadas"

      - name: cache_write_$/1M
        description: "Escritura de lectura de token desde una caché de respuestas previamente generadas"

      - name: context_length
        description: "Capacidad máxima total de tokens"
  - name: stg_pricepertoken_models
    description: "Modelos LLM procedentes de Pricepertoken"
    columns:
       - name: category
         description: "Tipo general de modelo Text,image,video,any,generation" 

       - name: slug
         description: "Identificador único del modelo en Hugging Face (normalmente Proveedor/nombre_modelo)"

       - name: license
         description: "Tipo de licencia declarada del modelo (por ejemplo: Apache-2.0, MIT, llama3, propietaria). Indica las condiciones legales de uso y redistribución"
         
       - name: openSource
         description: "Indicador booleano de si el modelo se considera de código abierto según la licencia y la disponibilidad de pesos/código."  
         
       - name: is_self_deployable
         description: "Booleano que indica si el modelo puede desplegarse por cuenta propia (por ejemplo, en tu propia infraestructura o servidor) sin depender de una API gestionada externa."
         
       - name: commercial_use
         description: "Indicador de si la licencia permite uso comercial del modelo (por ejemplo, integrarlo en productos o servicios de pago)."
         
       - name: input_price_per_million
         description: "Precio de entrada por token procesado"
         
       - name: output_price_per_million
         description: "Precio de salida por token procesado"
