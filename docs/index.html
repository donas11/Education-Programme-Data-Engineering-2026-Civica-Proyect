<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dbt Docs Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
:root,[data-theme="light"]{--bg:#f7f6f2;--surface:#f9f8f5;--surface2:#fbfbf9;--offset:#f3f0ec;--dynamic:#e6e4df;--divider:#dcd9d5;--border:#d4d1ca;--text:#28251d;--muted:#7a7974;--faint:#bab9b4;--primary:#01696f;--primary-hi:#cedcd8;--blue:#006494;--gold:#d19900;--success:#437a22;--purple:#7a39bb;--shadow:0 4px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#171614;--surface:#1c1b19;--surface2:#201f1d;--offset:#1d1c1a;--dynamic:#2d2c2a;--divider:#262523;--border:#393836;--text:#cdccca;--muted:#797876;--faint:#5a5957;--primary:#4f98a3;--primary-hi:#313b3b;--blue:#5591c7;--gold:#e8af34;--success:#6daa45;--purple:#a86fdf;--shadow:0 8px 20px rgba(0,0,0,.22)}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-rows:56px 44px 1fr;height:100vh}.topbar{display:flex;align-items:center;gap:1rem;padding:0 1.25rem;background:var(--surface);border-bottom:1px solid var(--divider)}.brand{font-weight:800}.search{flex:1;max-width:460px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:.6rem 1rem}.topbtn{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:.65rem;padding:.5rem .8rem}
.tabs{display:flex;gap:.5rem;padding:.4rem 1rem;background:var(--surface);border-bottom:1px solid var(--divider)}.tab{border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:.65rem;padding:.4rem .8rem;font-size:.9rem}.tab.active{background:var(--primary-hi);border-color:var(--primary);color:var(--primary)}
.layout{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - 100px)}.sidebar{overflow:auto;background:var(--surface);border-right:1px solid var(--divider);padding:1rem 0}.content{overflow:auto;padding:1.25rem}
.side-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);padding:0 1rem .4rem}.sidebar-item{display:flex;justify-content:space-between;align-items:center;width:100%;padding:.65rem 1rem;background:none;border:0;color:var(--muted);text-align:left}.sidebar-item:hover,.sidebar-item.active{background:var(--offset);color:var(--text)}.badge{font-size:.72rem;border-radius:999px;padding:.1rem .4rem;background:var(--dynamic)}
.filters{padding:.2rem 1rem .6rem;display:flex;flex-wrap:wrap;gap:.3rem}.chip-btn{border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:999px;padding:.3rem .55rem;font-size:.72rem}.chip-btn.active{background:var(--primary-hi);border-color:var(--primary);color:var(--primary)}
.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.65rem}.toolbar select,.toolbar button{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:.65rem;padding:.45rem .7rem;font-size:.88rem}
.stats{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:1rem}.stat{background:var(--surface);border:1px solid var(--divider);border-radius:.85rem;padding:.85rem;min-width:120px;box-shadow:var(--shadow)}.n{font-size:1.5rem;font-weight:800}.label{color:var(--muted);font-size:.82rem}
.grid{display:grid;gap:.75rem}.card{background:var(--surface);border:1px solid var(--divider);border-radius:.9rem;padding:.9rem;cursor:pointer;transition:.12s}.card:hover{border-color:var(--primary);transform:translateY(-1px)}.card.selected{border-color:var(--primary);background:var(--primary-hi)}.row{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}.mono{font-family:"JetBrains Mono",monospace}.muted{color:var(--muted)}.chips{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.4rem}.chip{font-size:.72rem;padding:.12rem .45rem;border-radius:999px;background:var(--offset);border:1px solid var(--border)}
.detail{margin-top:.9rem;background:var(--surface2);border:1px solid var(--divider);border-radius:1rem;padding:1.1rem}.section{margin-bottom:1.1rem}.section h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);border-bottom:1px solid var(--divider);padding-bottom:.45rem;margin-bottom:.7rem}
.table{width:100%;border-collapse:collapse;font-size:.84rem}.table th,.table td{text-align:left;padding:.5rem;border-bottom:1px solid var(--divider);vertical-align:top}.code{white-space:pre-wrap;overflow:auto;max-height:300px;background:var(--bg);border:1px solid var(--border);border-radius:.75rem;padding:.9rem;font-family:"JetBrains Mono",monospace;font-size:.78rem}
.kv{display:grid;grid-template-columns:170px 1fr;gap:.45rem .9rem}.node-lineage{height:380px;border:1px solid var(--divider);border-radius:.85rem;background:var(--bg)}.lineage-legend{display:flex;gap:1rem;flex-wrap:wrap;margin-top:.5rem;font-size:.8rem}.legend-dot{width:10px;height:10px;border-radius:999px;display:inline-block;margin-right:.3rem}.lineage-toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem}
.dag-container{background:var(--surface2);border:1px solid var(--divider);border-radius:1rem;padding:1rem}.full-dag{height:calc(100vh - 230px);min-height:600px;border:1px solid var(--divider);border-radius:.85rem;background:var(--bg)}.dag-summary{color:var(--muted);font-size:.85rem;margin-bottom:.6rem}.empty{padding:1.5rem;background:var(--surface);border:1px solid var(--divider);border-radius:1rem;color:var(--muted)}
@media(max-width:980px){.layout{grid-template-columns:1fr}.sidebar{display:none}.kv{grid-template-columns:1fr}.full-dag{height:70vh}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">dbt Docs Viewer</div>
    <input id="search" class="search" placeholder="Buscar modelos, columnas, path…">
    <button class="topbtn" onclick="toggleTheme()">Tema</button>
  </div>
  <div class="tabs">
    <button class="tab active" id="tab-list" onclick="switchTab('list')">📋 Recursos</button>
    <button class="tab" id="tab-dag" onclick="switchTab('dag')">🗺 DAG completo</button>
  </div>
  <div class="layout">
    <aside class="sidebar">
      <div class="side-title">Tipos</div>
      <div id="sidebarNav"></div>
      <div class="side-title">Capas</div>
      <div id="layerFilters" class="filters"></div>
    </aside>
    <main class="content">
      <section id="view-list">
        <div id="stats" class="stats"></div>
        <div id="list" class="grid"></div>
        <div id="detail"></div>
      </section>
      <section id="view-dag" style="display:none">
        <div class="dag-container">
          <div class="toolbar">
            <select id="dag-type-filter" onchange="renderDag()"><option value="all">Todos los tipos</option><option value="model">Modelos</option><option value="source">Sources</option><option value="seed">Seeds</option><option value="snapshot">Snapshots</option><option value="metric">Métricas</option><option value="semantic_model">Semantic models</option></select>
            <select id="dag-layer-filter" onchange="renderDag()"><option value="all">Todas las capas</option></select>
            <button onclick="fitDag()">Ajustar vista</button>
          </div>
          <div id="dag-summary" class="dag-summary"></div>
          <div id="full-dag" class="full-dag"></div>
        </div>
      </section>
    </main>
  </div>
</div>
<script>
fetch('./site-data.json').then(r=>r.json()).then(data=>{
  const allNodes=data.nodes||[];
  const childrenMap=data.children_map||{};
  const nodeMap=Object.fromEntries(allNodes.map(n=>[n.id,n]));
  const globalCounts=data.counts||{all:allNodes.length};
  const layers=data.layers||[];
  let state={view:'all',selectedId:null,currentLayer:null,activeTab:'list',nodeLineageMode:'both',nodeLineageDepth:'3'};
  let dagNetwork=null;
  let nodeNetwork=null;
  const TYPES=['all','model','source','seed','snapshot','metric','semantic_model'];
  const LABELS={all:'Todos',model:'Modelos',source:'Sources',seed:'Seeds',snapshot:'Snapshots',metric:'Métricas',semantic_model:'Semantic Models'};
  const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const search=document.getElementById('search');
  const TYPE_COLOR={model:'#4f98a3',source:'#5591c7',seed:'#e8af34',snapshot:'#a86fdf',metric:'#6daa45',semantic_model:'#4f98a3'};
  const tc=t=>TYPE_COLOR[t]||'#4f98a3';

  function clearResourceFilters(){ state.view='all'; state.currentLayer=null; }

  window.switchTab=function(tab){state.activeTab=tab;document.getElementById('view-list').style.display=tab==='list'?'block':'none';document.getElementById('view-dag').style.display=tab==='dag'?'block':'none';document.getElementById('tab-list').classList.toggle('active',tab==='list');document.getElementById('tab-dag').classList.toggle('active',tab==='dag');if(tab==='dag') renderDag();};

  function renderSidebar(){
    document.getElementById('sidebarNav').innerHTML=TYPES.map(t=>`<button class="sidebar-item ${state.view===t?'active':''}" onclick="window.__setView('${t}')"><span>${LABELS[t]}</span><span class="badge">${globalCounts[t]||0}</span></button>`).join('');
    document.getElementById('layerFilters').innerHTML=layers.map(l=>`<button class="chip-btn ${state.currentLayer===l?'active':''}" onclick="window.__toggleLayer('${l}')">${l}</button>`).join('') || '<span class="muted">Sin capas</span>';
    const dagLayerSel=document.getElementById('dag-layer-filter');
    const cur=dagLayerSel.value || 'all';
    dagLayerSel.innerHTML='<option value="all">Todas las capas</option>'+layers.map(l=>`<option value="${l}" ${cur===l?'selected':''}>${l}</option>`).join('');
  }

  function nodeMatches(n,typeFilter,layerFilter,q){
    if(typeFilter!=='all' && n.type!==typeFilter) return false;
    if(layerFilter && layerFilter!=='all' && !(n.path && (n.path===layerFilter || n.path.startsWith(layerFilter+'/')))) return false;
    if(q){const qq=q.toLowerCase(); return (n.name||'').toLowerCase().includes(qq)||(n.description||'').toLowerCase().includes(qq)||(n.path||'').toLowerCase().includes(qq)||Object.keys(n.columns||{}).some(c=>c.toLowerCase().includes(qq));}
    return true;
  }

  function filtered(){const q=(search.value||'').trim();return allNodes.filter(n=>nodeMatches(n,state.view,state.currentLayer,q));}

  function render(){
    const rows=filtered();
    const c={}; rows.forEach(n=>c[n.type]=(c[n.type]||0)+1);
    document.getElementById('stats').innerHTML=Object.entries(c).map(([k,v])=>`<div class="stat"><div class="n">${v}</div><div class="label">${LABELS[k]||k}</div></div>`).join('') || '<div class="empty">Sin resultados para este filtro.</div>';
    document.getElementById('list').innerHTML=rows.map(n=>`<div class="card ${state.selectedId===n.id?'selected':''}" onclick="window.__showDetail('${n.id}')"><div class="row"><strong class="mono">${esc(n.name)}</strong><span class="chip" style="border-color:${tc(n.type)};color:${tc(n.type)}">${n.type}</span>${n.materialized?`<span class="chip">${esc(n.materialized)}</span>`:''}</div>${n.description?`<div class="muted" style="margin-top:.3rem">${esc(n.description.slice(0,180))}${n.description.length>180?'…':''}</div>`:''}<div class="chips">${n.schema?`<span class="chip">${esc((n.database?n.database+'.':'')+n.schema)}</span>`:''}${n.path?`<span class="chip">${esc(n.path)}</span>`:''}${Object.keys(n.columns||{}).length?`<span class="chip">${Object.keys(n.columns).length} cols</span>`:''}${n.depends_on.length?`<span class="chip">${n.depends_on.length} deps</span>`:''}</div></div>`).join('');
    renderSidebar();
    if(state.selectedId) renderDetail(); else document.getElementById('detail').innerHTML='';
    if(state.activeTab==='dag') renderDag();
  }

  function renderDetail(){
    const n=allNodes.find(x=>x.id===state.selectedId); if(!n) return;
    const mCols=n.columns||{}; const cCols=(n.catalogNode&&n.catalogNode.columns)||{}; const allCols={...mCols};
    Object.entries(cCols).forEach(([k,v])=>{const lk=k.toLowerCase(); if(!allCols[lk]) allCols[lk]={}; allCols[lk]={...allCols[lk],type:v.type};});
    const colRows=Object.keys(allCols).sort().map(k=>{const c=allCols[k]; const t=c.type||cCols[k]?.type||cCols[k.toUpperCase()]?.type||'—'; return `<tr><td class="mono">${esc(k)}</td><td class="mono">${esc(t)}</td><td>${esc(c.description||'—')}</td></tr>`;}).join('');
    document.getElementById('detail').innerHTML=`<div class="detail"><div class="section"><h3>Recurso</h3><div class="row"><strong class="mono" style="font-size:1.05rem">${esc(n.name)}</strong><span class="chip">${n.type}</span>${n.materialized?`<span class="chip">${esc(n.materialized)}</span>`:''}</div>${n.description?`<p class="muted" style="margin:.4rem 0 0">${esc(n.description)}</p>`:''}</div><div class="section"><h3>Detalles</h3><div class="kv"><div>Unique ID</div><div class="mono" style="font-size:.8rem;word-break:break-all">${esc(n.id||'')}</div><div>Schema</div><div>${esc(n.schema||'—')}</div><div>Database</div><div>${esc(n.database||'—')}</div><div>Path</div><div class="mono" style="font-size:.82rem">${esc(n.path||n.original_file_path||'—')}</div><div>Package</div><div>${esc(n.package_name||'—')}</div><div>Dependencias directas</div><div>${n.depends_on.length}</div><div>Dependientes directos</div><div>${(childrenMap[n.id]||[]).length}</div></div></div><div class="section"><h3>Lineaje del nodo</h3><div class="lineage-toolbar"><select onchange="window.__setNodeLineageMode(this.value)"><option value="both" ${state.nodeLineageMode==='both'?'selected':''}>Upstream + Downstream</option><option value="upstream" ${state.nodeLineageMode==='upstream'?'selected':''}>Solo upstream</option><option value="downstream" ${state.nodeLineageMode==='downstream'?'selected':''}>Solo downstream</option></select><select onchange="window.__setNodeLineageDepth(this.value)"><option value="1" ${state.nodeLineageDepth==='1'?'selected':''}>Profundidad 1</option><option value="2" ${state.nodeLineageDepth==='2'?'selected':''}>Profundidad 2</option><option value="3" ${state.nodeLineageDepth==='3'?'selected':''}>Profundidad 3</option><option value="all" ${state.nodeLineageDepth==='all'?'selected':''}>Completo</option></select></div><div id="node-lineage" class="node-lineage"></div><div class="lineage-legend"><span><span class="legend-dot" style="background:#5591c7"></span>Upstream</span><span><span class="legend-dot" style="background:#4f98a3"></span>Nodo actual</span><span><span class="legend-dot" style="background:#e8af34"></span>Downstream</span></div></div>${Object.keys(allCols).length?`<div class="section"><h3>Columnas</h3><table class="table"><thead><tr><th>Columna</th><th>Tipo</th><th>Descripción</th></tr></thead><tbody>${colRows}</tbody></table></div>`:''}${n.depends_on.length?`<div class="section"><h3>Dependencias directas</h3><div class="chips">${n.depends_on.map(d=>`<button class="chip-btn mono" onclick="window.__jumpTo('${d}')">${esc((nodeMap[d]?.name)||d.split('.').pop())}</button>`).join('')}</div></div>`:''}${(childrenMap[n.id]||[]).length?`<div class="section"><h3>Dependientes directos</h3><div class="chips">${(childrenMap[n.id]||[]).map(d=>`<button class="chip-btn mono" onclick="window.__jumpTo('${d}')">${esc((nodeMap[d]?.name)||d.split('.').pop())}</button>`).join('')}</div></div>`:''}${n.compiled_code?`<div class="section"><h3>SQL compilado</h3><div class="code">${esc(n.compiled_code)}</div></div>`:''}</div>`;
    renderNodeLineage(n.id);
  }

  function collectNodeLineage(rootId,mode,depthSetting){
    const maxDepth=depthSetting==='all'?Infinity:parseInt(depthSetting,10); const gNodes=new Map(); const gEdges=new Map();
    function addN(id,role,level){const nx=nodeMap[id]; if(!nx) return; gNodes.set(id,{id,label:nx.name,role,level,type:nx.type});}
    function addE(from,to){gEdges.set(from+'->'+to,{from,to,arrows:'to'});}
    function up(id,d){if(d>maxDepth) return; const nx=nodeMap[id]; if(!nx) return; for(const p of (nx.depends_on||[])){if(!nodeMap[p]) continue; addN(p,'upstream',-d); addE(p,id); up(p,d+1);}}
    function down(id,d){if(d>maxDepth) return; for(const c of (childrenMap[id]||[])){if(!nodeMap[c]) continue; addN(c,'downstream',d); addE(id,c); down(c,d+1);}}
    addN(rootId,'selected',0); if(mode==='both'||mode==='upstream') up(rootId,1); if(mode==='both'||mode==='downstream') down(rootId,1);
    return {nodes:[...gNodes.values()],edges:[...gEdges.values()]};
  }

  function renderNodeLineage(rootId){
    const el=document.getElementById('node-lineage'); if(!el||typeof vis==='undefined') return; if(nodeNetwork) nodeNetwork.destroy();
    const g=collectNodeLineage(rootId,state.nodeLineageMode,state.nodeLineageDepth);
    const nodes=g.nodes.map(n=>({id:n.id,label:n.label,level:n.level,shape:'box',margin:8,color:n.role==='selected'?{background:'#fff',border:'#ff6b6b'}:n.role==='upstream'?{background:'#5591c7',border:'#5591c7'}:{background:'#e8af34',border:'#e8af34'},font:{color:n.role==='selected'?'#111':'#fff',face:'Inter'}}));
    nodeNetwork=new vis.Network(el,{nodes:new vis.DataSet(nodes),edges:new vis.DataSet(g.edges)},{layout:{hierarchical:{enabled:true,direction:'LR',sortMethod:'directed',levelSeparation:160,nodeSpacing:120,treeSpacing:160}},physics:false,interaction:{hover:true,navigationButtons:true,zoomView:true,dragView:true},edges:{smooth:{type:'cubicBezier',forceDirection:'horizontal',roundness:.4},color:{color:'rgba(160,160,160,.55)'},arrows:{to:{enabled:true,scaleFactor:.5}}}});
    nodeNetwork.on('click',params=>{if(params.nodes.length){state.selectedId=params.nodes[0]; clearResourceFilters(); search.value=''; render();}});
    setTimeout(()=>nodeNetwork.fit({animation:true}),80);
  }

  function computeVisibleGraph(){
    const q=(search.value||'').trim(); const typeFilter=document.getElementById('dag-type-filter').value; const layerFilter=document.getElementById('dag-layer-filter').value;
    const vis_nodes=allNodes.filter(n=>nodeMatches(n,typeFilter,layerFilter,q)); const vis_set=new Set(vis_nodes.map(n=>n.id)); const edges=[];
    for(const n of vis_nodes){for(const p of (n.depends_on||[])){if(vis_set.has(p)) edges.push({from:p,to:n.id,arrows:'to'});}}
    return {visibleNodes:vis_nodes,edges};
  }

  function assignLevels(visibleNodes,edges){
    const inc={},out={}; visibleNodes.forEach(n=>{inc[n.id]=0; out[n.id]=[];}); edges.forEach(e=>{inc[e.to]=(inc[e.to]||0)+1; out[e.from].push(e.to);});
    const q=[],lvl={}; visibleNodes.forEach(n=>{if(inc[n.id]===0){lvl[n.id]=0; q.push(n.id);}});
    while(q.length){const id=q.shift(); for(const c of out[id]){lvl[c]=Math.max(lvl[c]??0,(lvl[id]??0)+1); inc[c]-=1; if(inc[c]===0) q.push(c);}} visibleNodes.forEach(n=>{if(lvl[n.id]===undefined) lvl[n.id]=0;}); return lvl;
  }

  function renderDag(){
    const {visibleNodes,edges}=computeVisibleGraph(); const levels=assignLevels(visibleNodes,edges);
    const dagNodes=visibleNodes.map(n=>({id:n.id,label:n.name,level:levels[n.id]||0,shape:'box',margin:8,color:state.selectedId===n.id?{background:'#ffffff',border:'#ff6b6b'}:{background:tc(n.type),border:tc(n.type)},font:{color:state.selectedId===n.id?'#111':'#fff',face:'Inter'}}));
    const container=document.getElementById('full-dag'); if(dagNetwork) dagNetwork.destroy();
    dagNetwork=new vis.Network(container,{nodes:new vis.DataSet(dagNodes),edges:new vis.DataSet(edges)},{layout:{hierarchical:{enabled:true,direction:'LR',sortMethod:'directed',levelSeparation:150,nodeSpacing:130,treeSpacing:180}},physics:false,interaction:{hover:true,navigationButtons:true,keyboard:true,dragView:true,zoomView:true},edges:{smooth:{type:'cubicBezier',forceDirection:'horizontal',roundness:.45},color:{color:'rgba(160,160,160,.55)'},arrows:{to:{enabled:true,scaleFactor:.45}}}});
    dagNetwork.on('click',params=>{if(params.nodes.length){state.selectedId=params.nodes[0]; clearResourceFilters(); search.value=''; window.switchTab('list'); render(); setTimeout(()=>document.getElementById('detail')?.scrollIntoView({behavior:'smooth',block:'start'}),80);}});
    document.getElementById('dag-summary').textContent=`${visibleNodes.length} nodos · ${edges.length} relaciones`;
    setTimeout(()=>fitDag(),60);
  }

  window.fitDag=function(){if(dagNetwork) dagNetwork.fit({animation:true});};
  window.__setView=v=>{state.view=v; state.selectedId=null; render();};
  window.__toggleLayer=l=>{state.currentLayer=state.currentLayer===l?null:l; state.selectedId=null; render();};
  window.__showDetail=id=>{state.selectedId=id; render(); setTimeout(()=>document.getElementById('detail')?.scrollIntoView({behavior:'smooth',block:'start'}),50);};
  window.__jumpTo=id=>{const n=nodeMap[id]||allNodes.find(x=>x.name===id.split('.').pop()); if(n){state.selectedId=n.id; clearResourceFilters(); search.value=''; render(); setTimeout(()=>document.getElementById('detail')?.scrollIntoView({behavior:'smooth',block:'start'}),50);}};
  window.__setNodeLineageMode=v=>{state.nodeLineageMode=v; if(state.selectedId) renderDetail();};
  window.__setNodeLineageDepth=v=>{state.nodeLineageDepth=v; if(state.selectedId) renderDetail();};
  window.toggleTheme=()=>{document.documentElement.setAttribute('data-theme',document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'); render();};
  search.addEventListener('input',()=>{state.selectedId=null; render();});
  render();
}).catch(err=>{document.body.innerHTML='<pre style="padding:20px">Error cargando site-data.json: '+err.message+'</pre>'});
</script>
</body>
</html>
